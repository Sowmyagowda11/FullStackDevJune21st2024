            background-color: #ffffff;

        .contact-info h4 {
            color: #343a40;
        }
        .contact-info a {
            color: #007bff;
            text-decoration: none;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }
        .ratio iframe {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

                     <li class="nav-item"><a class="nav-link active text-white" aria-current="page" href="addToCart.html">AddToCart</a>
    </li>
                </ul>
            </div>
        </div>

    <!-- Page Title -->
    <div class="container py-5 text-center">
        <h1 class="mb-4">Contact Us</h1>
    </div>

    <!-- Contact Information -->
    <div class="container mb-5">
        <div class="row g-4">
            <div class="col-md-4 text-center">
                <div class="contact-info">
                    <h4>Our Location</h4>
                    <p>123 Foodie Lane, Gourmet City, FL 12345</p>
                </div>
            </div>
            <div class="col-md-4 text-center">
                <div class="contact-info">
                    <h4>Call Us</h4>
                    <p><a href="tel:+1234567890">+1 234 567 890</a></p>
                </div>
            </div>
            <div class="col-md-4 text-center">
                <div class="contact-info">
                    <h4>Email Us</h4>
                    <p><a href="mailto:info@restaurant.com">info@restaurant.com</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Contact Form -->
    <div class="container mb-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h4 class="text-center section-title mb-4">Send Us a Message</h4>
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Your Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Your Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Your Message</label>
                        <textarea class="form-control" id="message" rows="5" placeholder="Enter your message" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send Message</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Google Map -->

<div class="container my-5">
