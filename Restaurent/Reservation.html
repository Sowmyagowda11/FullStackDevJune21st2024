    <style>
        body {
            background-color: #f4f7fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .navbar-brand {
            font-weight: 700;
        }
        h2 {
            font-weight: 600;
            color: #343a40;
        }
        .form-control {
            border-radius: 0.75rem;
            border: 1px solid #ced4da;
        }
        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(38, 143, 255, 0.25);
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
            border-radius: 0.75rem;
            padding: 12px 24px;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        .footer {
            text-align: center;
            padding: 20px 0;
            background-color: #f8f9fa;
            color: #495057;
        }
        .footer a {
            color: #007bff;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

       <!-- Navbar -->
       <nav class="navbar navbar-expand-lg" style="background-color: rgb(169, 190, 221);">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bolder" href="#">The Family Table</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active text-white" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="aboutUS.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="Menu.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="Reviews.html">Reviews</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="Reservation.html">Table Reservation</a></li>

                     <li class="nav-item"><a class="nav-link active text-white" aria-current="page" href="addToCart.html">AddToCart</a>
                </ul>
            </div>
        </div>
    </nav>


    <!-- Reservation Form Section -->
    <div class="container mt-5">
        <h2 class="text-center mb-4">Restaurant Table Reservation</h2>
        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number" required>
            </div>
            <div class="mb-3">
                <label for="date" class="form-label">Reservation Date</label>
                <input type="date" class="form-control" id="date" required>
            </div>
            <div class="mb-3">
                <label for="time" class="form-label">Reservation Time</label>
                <input type="time" class="form-control" id="time" required>
            </div>
            <div class="mb-3">
                <label for="guests" class="form-label">Number of Guests</label>
                <input type="number" class="form-control" id="guests" placeholder="Enter number of guests" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Special Requests</label>
                <textarea class="form-control" id="message" rows="3" placeholder="Any special requests?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Reserve Table</button>
        </form>
    </div>

    <!-- Footer Section -->
    <footer class="footer">

</body>
