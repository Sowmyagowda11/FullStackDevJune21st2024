<head>

   <nav class="navbar navbar-expand-lg navbar-light bg-light ">
    <div class="container-fluid pt-3 pb-3 " style="background-color:rgb(169, 190, 221) ;">
      <a class="navbar-brand  fw-bolder" href="#">The Family Table</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" style="padding-left: 700px;">
          <li class="nav-item">
              <a class="nav-link active text-white" aria-current="page" href="index.html">Home</a>
          </li>
          <li class="nav-item">
              <a class="nav-link active text-white" aria-current="page" href="./aboutUS.html">About Us</a>
          </li>
          
          <li class="nav-item">
              <a class="nav-link active text-white" aria-current="page" href="Menu.html">Menu</a>
          </li>
          
          <li class="nav-item">
            <a class="nav-link active text-white" aria-current="page" href="Reviews.html">Reviews</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active text-white" aria-current="page" href="Reservation.html">Table-Reservation</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active text-white" aria-current="page" href="ContactUs.html">contact-Us</a>
    </li>
     <li class="nav-item"><a class="nav-link active text-white" aria-current="page" href="addToCart.html">AddToCart</a>
      </ul>
      
      </div>
    </div>
  </nav>

  <style>
    .cart-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 5px;
    }
    .cart-table td, .cart-table th {
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <!-- Navbar (optional) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    
  </nav>

  <!-- Cart Section -->
  <div class="container my-5">
    <h2 class="text-center mb-4">🛒 Your Cart</h2>

    <div class="table-responsive">
      <table class="table cart-table align-middle">
        <thead class="table-dark">
          <tr>
            <th scope="col">Item</th>
            <th scope="col">Dish</th>
            <th scope="col">Price</th>
            <th scope="col">Qty</th>
            <th scope="col">Subtotal</th>
            <th scope="col">Remove</th>
          </tr>
        </thead>
        <tbody>
          <!-- Item 1 -->
          <tr>
            <td><img src="./images/menu1.jpeg" alt="Parota Chicken" class="cart-img"></td>
            <td>Parota Chicken</td>
            <td>₹400</td>
            <td><input type="number" class="form-control" min="1" value="1" style="width: 80px;"></td>
            <td>₹400</td>
            <td><button class="btn btn-danger btn-sm">Remove</button></td>
          </tr>
          <!-- Item 2 -->
          <tr>
            <td><img src="./images/menu3.jpeg" alt="Choco Lava Cake" class="cart-img"></td>
            <td>Choco Lava Cake</td>
            <td>₹200</td>
            <td><input type="number" class="form-control" min="1" value="2" style="width: 80px;"></td>
            <td>₹400</td>
            <td><button class="btn btn-danger btn-sm">Remove</button></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Total & Checkout -->
    <div class="text-end">
      <h4 class="mb-3">Total: ₹800</h4>
      <a href="checkout.html" class="btn btn-success btn-lg">Proceed to Checkout</a>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center bg-dark text-white py-4 mt-5">
    © 2024 The Family Table. All rights reserved.
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
