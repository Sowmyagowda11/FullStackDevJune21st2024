        <h1 style="text-align: center; color: #333; margin-top: 5%;">REGISTER</h1>
        <br>
        <div class="reg">
        <h3 style="text-align: center; color: #666;">Register a new account</h3>
        <br>
        <p>Already Signed Up? Click <a href="#">Sign in</a> to login your account.</p>
        <br>
        
        <form class="form-reg" style="width: 70%; padding-left: 30%; margin-right: 30%;" >
            <label for="first-name" style="padding-right: 75%;">First Name</label>
            <input type="text" id="first-name" name="first-name" required style="margin-bottom: 20px;">
            
            <label for="last-name" style="padding-right: 75%;">Last Name</label>
            <input type="text" id="last-name" name="last-name"  style="margin-bottom: 20px;">
            
            <label for="email" style="padding-right: 75%;">Email Address *</label>
            <input type="email" id="email" name="email" required  style="margin-bottom: 20px;">
            
            <label for="password" style="padding-right: 75%;">Password *</label>
            <input type="password" id="password" name="password" required  style="margin-bottom: 20px;">
            
            <label for="confirm-password" style="padding-right: 65%;">Confirm Password *</label>
            <input type="password" id="confirm-password" name="confirm-password" required  style="margin-bottom: 20px;">
            
            <div class="checkbox"  style="display: inline;">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">I read <a href="#">Terms and Conditions</a></label>
            </div>
            
            <button type="submit">Register</button>
        </form>

        </div>
